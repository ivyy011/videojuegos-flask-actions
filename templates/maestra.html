
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRUD MySQL con Flask - {% block titulo %}{% endblock %}</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bulma@0.9.2/css/bulma.min.css">
</head>

<body>

    <!-- Barra de navegación -->
    <nav class="navbar is-warning" role="navigation" aria-label="main navigation">

        <div class="navbar-brand">
            <a href="https://parzibyte.me/blog" class="navbar-item">
                <img
                    alt="Logo de Parzibyte"
                    src="https://raw.githubusercontent.com/parzibyte/ejemplo-mern/main/src/img/parzibyte_logo.png"
                    style="max-height: 80px"
                />
            </a>

            <button class="navbar-burger is-warning button"
                    aria-label="menu"
                    aria-expanded="false"
                    data-target="navbarBasicExample">
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
            </button>
        </div>

        <div class="navbar-menu">

            <!-- Menú izquierdo -->
            <div class="navbar-start">

                {% if current_user.is_authenticated %}

                    <a class="navbar-item" href="{{ url_for('juegos') }}">
                        Juegos
                    </a>

                {% endif %}

            </div>

            <!-- Menú derecho -->
            <div class="navbar-end">

                <div class="navbar-item">
                    <div class="buttons">

                        <!-- Botón de ayuda -->
                        <a href="https://parzibyte.me#contacto"
                           class="button is-primary">
                            <strong>Ayuda y soporte</strong>
                        </a>

                        <!-- Botones de autenticación -->
                        {% if current_user.is_authenticated %}

                            <span class="navbar-item">
                                Hola, {{ current_user.username }}
                            </span>

                            <a href="{{ url_for('auth.logout') }}"
                               class="button is-danger">
                                <strong>Cerrar sesión</strong>
                            </a>

                        {% else %}

                            <a href="{{ url_for('auth.login') }}"
                               class="button is-link">
                                <strong>Ingresar</strong>
                            </a>

                        {% endif %}

                    </div>
                </div>

            </div>
        </div>
    </nav>

    <!-- Contenido de las páginas -->
    {% block contenido %}
    {% endblock %}

</body>
</html>
